[package]
name = "mupa-local"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Mupa native Rust local music engine (tag reader, SQLite library, Mix Mupa recommender, non-destructive artist stripper, UniFFI bindings)"

[lib]
name = "mupa_local"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"

[dependencies]
lofty = "0.22"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2.0"
uniffi = { version = "0.28", features = ["cli"] }

[dev-dependencies]
tempfile = "3.14"
