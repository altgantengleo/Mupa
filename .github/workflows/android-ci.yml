name: Android & Rust CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "stage-*"]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust_local_engine:
    name: Rust Local Engine Tests & cargo-ndk Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/local-rust

      - name: Run Rust unit tests
        run: cargo test --manifest-path engine/local-rust/Cargo.toml

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cross-compile libmupa_local.so (arm64-v8a & x86_64)
        working-directory: engine/local-rust
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -o ../../app/src/main/jniLibs build --release -p mupa-local

      - name: Upload native Rust jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: mupa-rust-jnilibs
          path: app/src/main/jniLibs/**/*.so
          retention-days: 7

  build_and_verify:
    name: Android Build, Lint, Unit Tests & Releases
    runs-on: ubuntu-latest
    needs: [rust_local_engine]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download native Rust jniLibs
        uses: actions/download-artifact@v4
        with:
          name: mupa-rust-jnilibs
          path: app/src/main/jniLibs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run All JVM & Android Unit Tests
        run: |
          ./gradlew :streaming:innertube:test :streaming:jiosaavn:test :streaming:aggregator:test :playback:testDebugUnitTest :engine:local:testDebugUnitTest :app:testDebugUnitTest --console=plain --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --console=plain --stacktrace

      - name: Assemble Debug APKs (arm64-v8a, x86_64, universal)
        run: ./gradlew assembleDebug --console=plain --stacktrace

      - name: Assemble Release APKs (R8 verify)
        run: ./gradlew assembleRelease --console=plain --stacktrace

      - name: Prepare Release APK filenames
        run: |
          mkdir -p dist-apks
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist-apks/Mupa-v1.0.0-arm64-v8a-debug.apk
          cp app/build/outputs/apk/debug/app-universal-debug.apk dist-apks/Mupa-v1.0.0-universal-debug.apk
          ls -lh dist-apks/

      - name: Upload ARM64 & Universal Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: mupa-v1.0.0-apks
          path: dist-apks/*.apk
          retention-days: 14

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mupa-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            core/designsystem/build/reports/lint-results-debug.html
            playback/build/reports/lint-results-debug.html
            engine/local/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Publish to GitHub Releases (main & version tags)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0-preview' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Mupa {0}', github.ref_name) || 'Mupa v1.0.0 (Preview ARM64 & Universal)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body: |
            Build otomatis Mupa **v1.0.0** (dengan engine lokal Rust `libmupa_local.so` terintegrasi).

            - **HP Android modern (disarankan):** unduh `Mupa-v1.0.0-arm64-v8a-debug.apk`
            - **Perangkat lain / emulator:** unduh `Mupa-v1.0.0-universal-debug.apk`
          files: |
            dist-apks/Mupa-v1.0.0-arm64-v8a-debug.apk
            dist-apks/Mupa-v1.0.0-universal-debug.apk
