name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "stage-*"]
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    branches: ["main"]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_verify:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --console=plain --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --console=plain --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --console=plain --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mupa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mupa-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            core/designsystem/build/reports/lint-results-debug.html
          retention-days: 7
